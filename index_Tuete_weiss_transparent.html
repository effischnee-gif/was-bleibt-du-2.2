<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Was bleibt – AR</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#status{
 position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
 z-index:9999;padding:10px 16px;border-radius:20px;background:rgba(0,0,0,.65);
 color:#fff;font:16px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;white-space:nowrap
}
</style>

<script>
AFRAME.registerComponent('white-transparent-plastic', {
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const obj = this.el.getObject3D('mesh');
      if (!obj) return;

      obj.traverse((node) => {
        if (!node.isMesh) return;

        // Render both front and back faces so the thin bag does not disappear
        // while rotating.
        const mats = Array.isArray(node.material) ? node.material : [node.material];

        const newMats = mats.map(() => {
          const m = new THREE.MeshPhysicalMaterial({
            color: new THREE.Color(0xffffff),
            transparent: true,
            opacity: 0.48,
            roughness: 0.28,
            metalness: 0.0,
            transmission: 0.12,
            thickness: 0.12,
            ior: 1.46,
            clearcoat: 0.55,
            clearcoatRoughness: 0.22,
            side: THREE.DoubleSide,
            depthWrite: false
          });
          m.needsUpdate = true;
          return m;
        });

        node.material = Array.isArray(node.material) ? newMats : newMats[0];
        node.castShadow = false;
        node.receiveShadow = false;
      });
    });
  }
});
</script>
</head>

<body>
<div id="status">Suche das Bild …</div>

<a-scene
 mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes"
 color-space="sRGB"
 renderer="colorManagement: true, physicallyCorrectLights"
 vr-mode-ui="enabled: false"
 device-orientation-permission-ui="enabled: false">

 <a-assets>
   <a-asset-item id="bagModel" src="./Muelltuete_AR_3D_plastisch_v3.glb"></a-asset-item>
 </a-assets>

 <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

 <!-- Soft lights create white highlights and readable folds -->
 <a-entity light="type: ambient; intensity: 2.0; color: #ffffff"></a-entity>
 <a-entity light="type: directional; intensity: 2.4; color: #ffffff" position="-1 2 3"></a-entity>
 <a-entity light="type: directional; intensity: 1.3; color: #ffffff" position="2 -0.5 2"></a-entity>

 <a-entity mindar-image-target="targetIndex: 0">
   <a-entity
     id="bag"
     position="0 0 0.18"
     scale="0.72 0.72 0.72"
     animation__turn="property: rotation; from: 0 -15 0; to: 0 345 0; dur: 14000; easing: linear; loop: true"
     animation__float="property: position; from: 0 -0.025 0.18; to: 0 0.035 0.18; dur: 3800; easing: easeInOutSine; dir: alternate; loop: true">
       <a-gltf-model
         src="#bagModel"
         white-transparent-plastic>
       </a-gltf-model>
   </a-entity>
 </a-entity>

</a-scene>

<script>
const scene=document.querySelector('a-scene');
const status=document.getElementById('status');

scene.addEventListener('targetFound',()=>{
 status.textContent='✓ Bild erkannt';
 setTimeout(()=>status.style.display='none',1200);
});

scene.addEventListener('targetLost',()=>{
 status.style.display='block';
 status.textContent='Bild verloren – wieder auf das Foto richten';
});
</script>

</body>
</html>
