<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Was bleibt – AR Diagnose</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
#diag{
 position:fixed;left:10px;right:10px;bottom:12px;z-index:99999;
 background:rgba(0,0,0,.78);color:white;padding:10px 12px;border-radius:12px;
 font:14px/1.35 -apple-system,BlinkMacSystemFont,sans-serif
}
.ok{color:#9cff9c}.wait{color:#ffe58a}.bad{color:#ff9c9c}
</style>
</head>

<body>
<div id="diag">
 <div id="ar" class="wait">1. AR: startet …</div>
 <div id="targetState" class="wait">2. Target: noch nicht erkannt</div>
 <div id="modelState" class="wait">3. GLB: wartet …</div>
 <div id="result" class="wait">4. Anzeige: wartet …</div>
</div>

<a-scene
 mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes"
 color-space="sRGB"
 renderer="colorManagement: true, physicallyCorrectLights"
 vr-mode-ui="enabled: false"
 device-orientation-permission-ui="enabled: false">

 <a-assets timeout="20000">
  <a-asset-item id="bagAsset" src="./Muelltuete_AR_neu_geschlossen.glb"></a-asset-item>
 </a-assets>

 <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

 <a-entity light="type: ambient; intensity: 1.6; color: #ffffff"></a-entity>
 <a-entity light="type: directional; intensity: 1.3; color: #ffffff" position="-1 2 3"></a-entity>

 <a-entity id="target" mindar-image-target="targetIndex: 0">

   <!-- Kontrollobjekt: muss bei erkanntem Target sichtbar sein -->
   <a-box id="cube"
     visible="false"
     position="-0.32 0 0.18"
     scale="0.16 0.16 0.16"
     color="#00ff66"
     animation="property: rotation; to: 0 360 0; dur: 2500; loop: true; easing: linear">
   </a-box>

   <!-- Neues Tütenmodell -->
   <a-entity id="bagWrap"
     visible="false"
     position="0.12 0 0.24"
     scale="0.72 0.72 0.72"
     animation__turn="property: rotation; from: 0 -18 0; to: 0 342 0; dur: 15000; easing: linear; loop: true">
     <a-gltf-model id="bag" src="#bagAsset"></a-gltf-model>
   </a-entity>

 </a-entity>
</a-scene>

<script>
const scene = document.querySelector('a-scene');
const target = document.getElementById('target');
const cube = document.getElementById('cube');
const bagWrap = document.getElementById('bagWrap');
const bag = document.getElementById('bag');

const ar = document.getElementById('ar');
const targetState = document.getElementById('targetState');
const modelState = document.getElementById('modelState');
const result = document.getElementById('result');

let modelLoaded = false;
let targetFound = false;

scene.addEventListener('arReady', () => {
 ar.textContent = '1. AR: Kamera bereit ✓';
 ar.className = 'ok';
});

scene.addEventListener('arError', () => {
 ar.textContent = '1. AR: Startfehler ✗';
 ar.className = 'bad';
});

bag.addEventListener('model-loaded', () => {
 modelLoaded = true;
 modelState.textContent = '3. GLB: geladen ✓';
 modelState.className = 'ok';
 if(targetFound){
   bagWrap.setAttribute('visible', true);
   result.textContent = '4. Anzeige: grüner Würfel + 3-D-Tüte';
   result.className = 'ok';
 }
});

bag.addEventListener('model-error', () => {
 modelState.textContent = '3. GLB: FEHLER beim Laden ✗';
 modelState.className = 'bad';
 result.textContent = '4. Anzeige: Modell-Datei/Pfad prüfen';
 result.className = 'bad';
});

target.addEventListener('targetFound', () => {
 targetFound = true;
 targetState.textContent = '2. Target: erkannt ✓';
 targetState.className = 'ok';

 cube.setAttribute('visible', true);

 if(modelLoaded){
   bagWrap.setAttribute('visible', true);
   result.textContent = '4. Anzeige: grüner Würfel + 3-D-Tüte';
   result.className = 'ok';
 } else {
   result.textContent = '4. Anzeige: grüner Würfel; GLB lädt noch …';
   result.className = 'wait';
 }
});

target.addEventListener('targetLost', () => {
 targetFound = false;
 targetState.textContent = '2. Target: verloren / wird gesucht';
 targetState.className = 'wait';
 cube.setAttribute('visible', false);
 bagWrap.setAttribute('visible', false);
 result.textContent = '4. Anzeige: wartet auf Target';
 result.className = 'wait';
});
</script>
</body>
</html>
