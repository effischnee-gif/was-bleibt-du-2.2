<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Was bleibt – AR</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#status{
 position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
 z-index:9999;padding:10px 16px;border-radius:20px;background:rgba(0,0,0,.65);
 color:white;font:16px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;white-space:nowrap
}
</style>
</head>
<body>

<div id="status">Suche das Bild …</div>

<a-scene
 mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes"
 color-space="sRGB"
 renderer="colorManagement: true, physicallyCorrectLights"
 vr-mode-ui="enabled: false"
 device-orientation-permission-ui="enabled: false">

 <a-assets>
   <a-asset-item id="bagModel" src="./Muelltuete_AR_3D_plastisch_v3.glb"></a-asset-item>
 </a-assets>

 <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

 <a-entity mindar-image-target="targetIndex: 0">
   <a-entity
     id="bag"
     position="0 0 0.18"
     scale="0.72 0.72 0.72"
     animation__turn="property: rotation; from: 0 -15 0; to: 0 345 0; dur: 14000; easing: linear; loop: true"
     animation__float="property: position; from: 0 -0.025 0.18; to: 0 0.035 0.18; dur: 3800; easing: easeInOutSine; dir: alternate; loop: true">
       <a-gltf-model src="#bagModel"></a-gltf-model>
   </a-entity>
 </a-entity>

</a-scene>

<script>
const scene=document.querySelector('a-scene');
const status=document.getElementById('status');

scene.addEventListener('targetFound',()=>{
 status.textContent='✓ Bild erkannt';
 setTimeout(()=>status.style.display='none',1200);
});

scene.addEventListener('targetLost',()=>{
 status.style.display='block';
 status.textContent='Bild verloren – wieder auf das Foto richten';
});
</script>

</body>
</html>
