<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Was bleibt – AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99999;background:rgba(0,0,0,.65);color:#fff;padding:9px 14px;border-radius:18px;font:14px -apple-system,BlinkMacSystemFont,sans-serif;white-space:nowrap}</style>
<script>
AFRAME.registerComponent('organic-bag',{init:function(){this.ms=[];this.el.addEventListener('model-loaded',()=>{this.el.getObject3D('mesh').traverse(o=>{if(o.isMesh&&o.morphTargetInfluences){o.material.transparent=true;o.material.opacity=.62;o.material.depthWrite=false;o.material.side=THREE.DoubleSide;o.material.needsUpdate=true;this.ms.push(o)}})})},tick:function(t){let s=t/1000,a=.5+.5*Math.sin(s*.72),c=.5+.5*Math.sin(s*.72+Math.PI),b=.5+.5*Math.sin(s*.39+1.1);this.ms.forEach(m=>{m.morphTargetInfluences[0]=.52*a;m.morphTargetInfluences[1]=.30*c;m.morphTargetInfluences[2]=.38*b});this.el.object3D.rotation.y=s*.20+.12*Math.sin(s*.31);this.el.object3D.rotation.z=.055*Math.sin(s*.47);this.el.object3D.rotation.x=.035*Math.sin(s*.29+.8)}})
</script></head><body><div id="status">Suche das Bild …</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-assets timeout="20000"><a-asset-item id="bagAsset" src="./Muelltuete_AR_V3_atmend.glb"></a-asset-item></a-assets><a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity light="type: ambient; intensity: .95"></a-entity><a-entity light="type: directional; intensity: 1.25" position="-1.5 2 3"></a-entity><a-entity light="type: directional; intensity: .5; color: #dce8ff" position="2 -1 1.5"></a-entity>
<a-entity id="target" mindar-image-target="targetIndex: 0"><a-entity position="0 0 .25" animation="property: position; from: 0 -.022 .25; to: 0 .032 .25; dur: 4700; easing: easeInOutSine; dir: alternate; loop: true"><a-gltf-model id="bag" src="#bagAsset" scale=".72 .72 .72" organic-bag></a-gltf-model></a-entity></a-entity></a-scene>
<script>const t=document.getElementById('target'),s=document.getElementById('status'),b=document.getElementById('bag');t.addEventListener('targetFound',()=>{s.textContent='✓ Bild erkannt';setTimeout(()=>s.style.display='none',1000)});t.addEventListener('targetLost',()=>{s.style.display='block';s.textContent='Bild verloren – wieder auf das Foto richten'});b.addEventListener('model-error',()=>{s.style.display='block';s.textContent='3-D-Modell konnte nicht geladen werden'})</script></body></html>
