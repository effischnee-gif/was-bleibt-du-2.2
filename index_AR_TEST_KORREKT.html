<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Was bleibt – AR Test</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#status{position:fixed;z-index:100;top:16px;left:50%;transform:translateX(-50%);
padding:10px 15px;border-radius:18px;background:rgba(0,0,0,.72);color:white;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;
white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div id="status">AR wird gestartet …</div>
<a-scene
 mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes"
 color-space="sRGB"
 renderer="colorManagement: true; alpha: true; antialias: true"
 vr-mode-ui="enabled: false"
 device-orientation-permission-ui="enabled: false"
 embedded>
 <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
 <a-entity mindar-image-target="targetIndex: 0">
  <a-box position="0 0 0.15" scale="0.35 0.35 0.35" color="#ffffff"
   material="opacity: 0.8; transparent: true"
   animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
  </a-box>
 </a-entity>
 <a-entity light="type: ambient; intensity: 1.2"></a-entity>
 <a-entity light="type: directional; intensity: 1.5" position="1 2 2"></a-entity>
</a-scene>
<script>
const status=document.getElementById('status');
const scene=document.querySelector('a-scene');
const target=document.querySelector('[mindar-image-target]');
target.addEventListener('targetFound',()=>status.textContent='✓ Bild erkannt – AR funktioniert');
target.addEventListener('targetLost',()=>status.textContent='Bild nicht mehr erkannt');
scene.addEventListener('arReady',()=>status.textContent='Kamera bereit – zeige auf dein Foto');
scene.addEventListener('arError',()=>status.textContent='AR-Start fehlgeschlagen');
</script>
</body>
</html>
