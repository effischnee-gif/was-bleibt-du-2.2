<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Was bleibt – AR V9</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#audioPanel{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;display:none;align-items:center;gap:10px;background:rgba(15,15,15,.72);color:#fff;padding:10px 14px;border-radius:999px;font:15px -apple-system,BlinkMacSystemFont,sans-serif}
#audioButton{border:0;border-radius:999px;padding:9px 14px;background:#fff;color:#111;font-weight:600;font-size:15px}
</style>
<script>
AFRAME.registerComponent("v9bag",{
 init(){this.ms=[];this.el.addEventListener("model-loaded",()=>{
   this.el.getObject3D("mesh").traverse(o=>{
     if(o.isMesh){
       o.material.transparent=true;o.material.opacity=.28;o.material.depthWrite=false;
       o.material.side=THREE.DoubleSide;o.material.roughness=.30;o.material.needsUpdate=true;
       if(o.morphTargetInfluences)this.ms.push(o);
     }
   });
 });},
 tick(t){
   const s=t/1000;
   // Formänderung: groß -> klein -> groß, kombiniert mit organischen Morphs.
   const breathe=.5+.5*Math.sin(s*.55);
   const q=[
     .48*breathe,                 // aufblähen
     .30*(1-breathe),             // zusammenziehen
     .22*(.5+.5*Math.sin(s*.22+2.2)),
     .20*(.5+.5*Math.sin(s*.27+.8)),
     .22*(.5+.5*Math.sin(s*.34+3.5)),
     .24*(.5+.5*Math.sin(s*.46+4.4)),
     .20*(.5+.5*Math.sin(s*.68))
   ];
   this.ms.forEach(m=>q.forEach((v,i)=>{if(i<m.morphTargetInfluences.length)m.morphTargetInfluences[i]=v}));

   // Zusätzlich wächst/schrumpft das gesamte Objekt sanft um ca. 18 %.
   const sc=.78 + .14*breathe;
   this.el.object3D.scale.set(sc,sc,sc);

   // langsame Drehung + leichtes Schweben
   this.el.object3D.rotation.y=s*.105;
   this.el.object3D.rotation.x=.04*Math.sin(s*.24);
   this.el.object3D.rotation.z=.05*Math.sin(s*.31+.7);
   this.el.object3D.position.y=.018*Math.sin(s*.42);
 }
});
window.addEventListener("DOMContentLoaded",()=>{
 const target=document.querySelector("#target"), panel=document.querySelector("#audioPanel");
 const btn=document.querySelector("#audioButton"), audio=document.querySelector("#narration");
 target.addEventListener("targetFound",()=>panel.style.display="flex");
 target.addEventListener("targetLost",()=>{if(audio.paused)panel.style.display="none"});
 btn.addEventListener("click",async()=>{
   if(audio.paused){try{await audio.play();btn.textContent="❚❚ Pause"}catch(e){}}
   else{audio.pause();btn.textContent="▶ Anhören"}
 });
 audio.addEventListener("ended",()=>btn.textContent="▶ Noch einmal");
});
</script></head><body>
<audio id="narration" preload="auto" playsinline><source src="./Was_bleibt_Audio.m4a" type="audio/mp4"></audio>
<div id="audioPanel"><button id="audioButton">▶ Anhören</button><span>Was bleibt?</span></div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1"
 renderer="colorManagement:true; alpha:true; antialias:true"
 vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-assets><a-asset-item id="bagAsset" src="./Muelltuete_AR_V9_lang_morphing.glb"></a-asset-item></a-assets>
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity light="type:ambient;intensity:.76"></a-entity>
<a-entity light="type:directional;intensity:1.4" position="-2 2.5 3"></a-entity>
<a-entity id="target" mindar-image-target="targetIndex:0">
<a-gltf-model id="bag" src="#bagAsset" position="0 0 .32" v9bag></a-gltf-model>
</a-entity></a-scene></body></html>
