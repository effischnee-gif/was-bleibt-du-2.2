<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Was bleibt – AR Test</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #status {
      position: fixed;
      z-index: 20;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 20px;
      background: rgba(0,0,0,.72);
      color: white;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="status">Kamera wird gestartet …</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes"
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
    background="color: transparent">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-box
        id="testBox"
        position="0 0 0.15"
        rotation="0 0 0"
        width="0.35"
        height="0.35"
        depth="0.35"
        material="color: #ffffff; opacity: 0.75; transparent: true"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
      </a-box>
    </a-entity>

    <a-entity light="type: ambient; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 1.5" position="1 2 2"></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById('status');
    const scene = document.querySelector('a-scene');

    scene.addEventListener('arReady', () => {
      status.textContent = 'Kamera bereit – zeige auf dein Foto.';
    });

    scene.addEventListener('targetFound', () => {
      status.textContent = '✓ Bild erkannt – AR funktioniert!';
    });

    scene.addEventListener('targetLost', () => {
      status.textContent = 'Bild verloren – wieder auf das Foto zeigen.';
    });

    scene.addEventListener('arError', () => {
      status.textContent = 'AR konnte nicht gestartet werden.';
    });
  </script>
</body>
</html>
