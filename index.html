<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Was bleibt – AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
#status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99999;
background:rgba(0,0,0,.68);color:white;padding:9px 14px;border-radius:18px;
font:14px/1.25 -apple-system,BlinkMacSystemFont,sans-serif;white-space:nowrap}
</style>
</head>
<body>
<div id="status">Suche das Bild …</div>
<a-scene
 mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes"
 color-space="sRGB"
 renderer="colorManagement: true, physicallyCorrectLights"
 vr-mode-ui="enabled: false"
 device-orientation-permission-ui="enabled: false">
 <a-assets timeout="20000">
  <a-asset-item id="bagAsset" src="./Muelltuete_AR_V2_milchig_duenn.glb"></a-asset-item>
 </a-assets>
 <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
 <a-entity light="type: ambient; intensity: 1.05; color: #ffffff"></a-entity>
 <a-entity light="type: directional; intensity: 1.25; color: #ffffff" position="-1.5 2 3"></a-entity>
 <a-entity light="type: directional; intensity: 0.55; color: #dce8ff" position="2 -1 1.5"></a-entity>

 <a-entity id="target" mindar-image-target="targetIndex: 0">
   <a-entity position="0 0 0.22" scale="0.72 0.72 0.72"
    animation__turn="property: rotation; from: 0 -18 0; to: 0 342 0; dur: 17000; easing: linear; loop: true"
    animation__float="property: position; from: 0 -0.018 0.22; to: 0 0.026 0.22; dur: 4200; easing: easeInOutSine; dir: alternate; loop: true">
     <a-gltf-model id="bag" src="#bagAsset"></a-gltf-model>
   </a-entity>
 </a-entity>
</a-scene>
<script>
const target=document.getElementById('target'), status=document.getElementById('status'), bag=document.getElementById('bag');
target.addEventListener('targetFound',()=>{status.textContent='✓ Bild erkannt';setTimeout(()=>status.style.display='none',1000);});
target.addEventListener('targetLost',()=>{status.style.display='block';status.textContent='Bild verloren – wieder auf das Foto richten';});
bag.addEventListener('model-error',()=>{status.style.display='block';status.textContent='3-D-Modell konnte nicht geladen werden';});
</script>
</body></html>
