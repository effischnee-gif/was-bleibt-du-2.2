<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Was bleibt – AR V6</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99999;background:rgba(0,0,0,.62);color:#fff;padding:9px 14px;border-radius:18px;font:14px -apple-system,BlinkMacSystemFont,sans-serif;white-space:nowrap}</style>
<script>
AFRAME.registerComponent('v6-bag',{init:function(){this.m=[];this.el.addEventListener('model-loaded',()=>{this.el.getObject3D('mesh').traverse(o=>{if(o.isMesh&&o.morphTargetInfluences){o.material.transparent=true;o.material.opacity=.31;o.material.depthWrite=false;o.material.side=THREE.DoubleSide;o.material.roughness=.38;o.material.needsUpdate=true;this.m.push(o)}})})},
tick:function(t){const s=t/1000;
const q=[
.52*(.5+.5*Math.sin(s*.47)),
.42*(.5+.5*Math.sin(s*.39+2.6)),
.34*(.5+.5*Math.sin(s*.29+1.1)),
.46*(.5+.5*Math.sin(s*.23+4.0)),
.38*(.5+.5*Math.sin(s*.36+5.0)),
.30*(.5+.5*Math.sin(s*.61+.4))
];
this.m.forEach(m=>q.forEach((v,i)=>{if(i<m.morphTargetInfluences.length)m.morphTargetInfluences[i]=v}));
this.el.object3D.rotation.y=s*.13+.13*Math.sin(s*.19);
this.el.object3D.rotation.x=.08*Math.sin(s*.27+.5);
this.el.object3D.rotation.z=.09*Math.sin(s*.34);
}});
</script></head><body><div id="status">Suche das Bild …</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-assets timeout="20000"><a-asset-item id="bagAsset" src="./Muelltuete_AR_V6_volumetrisch.glb"></a-asset-item></a-assets>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity light="type: ambient; intensity: .78"></a-entity><a-entity light="type: directional; intensity: 1.45" position="-1.7 2.3 3"></a-entity><a-entity light="type: directional; intensity: .7; color: #e5edff" position="2 -1 1"></a-entity>
<a-entity id="target" mindar-image-target="targetIndex: 0"><a-entity position="0 0 .31" animation="property: position; from: 0 -.04 .31; to: 0 .05 .31; dur: 6000; easing: easeInOutSine; dir: alternate; loop: true"><a-gltf-model id="bag" src="#bagAsset" scale=".78 .78 .78" v6-bag></a-gltf-model></a-entity></a-entity></a-scene>
<script>const t=document.getElementById('target'),s=document.getElementById('status'),b=document.getElementById('bag');t.addEventListener('targetFound',()=>{s.textContent='✓ Bild erkannt';setTimeout(()=>s.style.display='none',900)});t.addEventListener('targetLost',()=>{s.style.display='block';s.textContent='Bild verloren – wieder auf das Foto richten'});b.addEventListener('model-error',()=>{s.style.display='block';s.textContent='3-D-Modell konnte nicht geladen werden'})</script></body></html>
