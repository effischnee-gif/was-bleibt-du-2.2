<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Was bleibt – AR</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#status{
 position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
 z-index:9999;padding:10px 16px;border-radius:20px;background:rgba(0,0,0,.65);
 color:#fff;font:16px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;white-space:nowrap
}
</style>

<script>
AFRAME.registerComponent('bag-material-fix', {
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const model = this.el.getObject3D('mesh');
      if (!model) return;

      model.traverse((node) => {
        if (!node.isMesh || !node.material) return;

        const materials = Array.isArray(node.material) ? node.material : [node.material];

        materials.forEach((mat) => {
          // Keep the GLB's original material/shading and change only the
          // properties that caused the model to render black.
          if (mat.color) mat.color.setRGB(1, 1, 1);
          if ('metalness' in mat) mat.metalness = 0.0;
          if ('roughness' in mat) mat.roughness = 0.48;

          mat.transparent = true;
          mat.opacity = 0.72;
          mat.side = THREE.DoubleSide;

          // Keep depth writing enabled: this is more reliable on iOS/Safari
          // for a folded, self-overlapping transparent mesh.
          mat.depthWrite = true;
          mat.depthTest = true;

          if (mat.emissive) {
            mat.emissive.setRGB(0.10, 0.10, 0.10);
            mat.emissiveIntensity = 0.35;
          }

          mat.needsUpdate = true;
        });
      });
    });
  }
});
</script>
</head>

<body>
<div id="status">Suche das Bild …</div>

<a-scene
 mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes"
 color-space="sRGB"
 renderer="colorManagement: true, physicallyCorrectLights"
 vr-mode-ui="enabled: false"
 device-orientation-permission-ui="enabled: false">

 <a-assets timeout="10000">
   <a-asset-item id="bagModel" src="./Muelltuete_AR_3D_plastisch_v3.glb"></a-asset-item>
 </a-assets>

 <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

 <a-entity light="type: ambient; intensity: 2.2; color: #ffffff"></a-entity>
 <a-entity light="type: directional; intensity: 1.8; color: #ffffff" position="-1 2 3"></a-entity>
 <a-entity light="type: directional; intensity: 1.0; color: #ffffff" position="2 -1 2"></a-entity>

 <a-entity id="target" mindar-image-target="targetIndex: 0">
   <a-entity
     position="0 0 0.18"
     scale="0.72 0.72 0.72"
     animation__turn="property: rotation; from: 0 -15 0; to: 0 345 0; dur: 14000; easing: linear; loop: true"
     animation__float="property: position; from: 0 -0.025 0.18; to: 0 0.035 0.18; dur: 3800; easing: easeInOutSine; dir: alternate; loop: true">
       <a-gltf-model id="bag" src="#bagModel" bag-material-fix></a-gltf-model>
   </a-entity>
 </a-entity>

</a-scene>

<script>
const target=document.getElementById('target');
const status=document.getElementById('status');
const bag=document.getElementById('bag');

target.addEventListener('targetFound',()=>{
  status.textContent='✓ Bild erkannt';
  setTimeout(()=>status.style.display='none',1200);
});
target.addEventListener('targetLost',()=>{
  status.style.display='block';
  status.textContent='Bild verloren – wieder auf das Foto richten';
});
bag.addEventListener('model-error',()=>{
  status.style.display='block';
  status.textContent='3-D-Modell konnte nicht geladen werden';
});
</script>
</body>
</html>
