<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Was bleibt – AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
a-scene{position:fixed!important;inset:0;width:100%;height:100%;background:transparent!important}
#status{position:fixed;z-index:30;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;white-space:nowrap;pointer-events:none}
#hint{position:fixed;z-index:30;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(88vw,520px);box-sizing:border-box;padding:13px 17px;border-radius:18px;background:rgba(0,0,0,.62);color:#fff;text-align:center;line-height:1.35;font-size:14px;pointer-events:none}
#hint strong{display:block;margin-bottom:4px;font-size:16px}.hidden{display:none!important}
</style>
</head>
<body>
<div id="status">Kamera wird vorbereitet …</div>
<div id="hint"><strong>Was bleibt</strong>Richte die Kamera auf das Foto der Mülltüte. Sobald es erkannt wird, erscheint die Skulptur frei im realen Raum.</div>
<a-scene id="scene"
 mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes"
 renderer="alpha: true; antialias: true; colorManagement: true; physicallyCorrectLights: true; sortObjects: true; precision: high"
 embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" fog="type: none">
 <a-assets>
   <a-asset-item id="bagModel" src="./Muelltuete_AR_3D_plastisch_v3.glb"></a-asset-item>
 </a-assets>
 <a-entity light="type: ambient; intensity: 0.75"></a-entity>
 <a-entity light="type: directional; intensity: 2.4" position="-1.5 2.5 2.5"></a-entity>
 <a-entity light="type: directional; intensity: 1.2" position="2 -0.5 1.5"></a-entity>
 <a-entity light="type: point; intensity: 0.8; distance: 5" position="0 0 2"></a-entity>
 <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
 <a-entity id="target" mindar-image-target="targetIndex: 0">
   <a-entity id="bag" position="0 0 0.25" scale="0.70 0.70 0.70"
    animation__spin="property: rotation; from: 0 -8 0; to: 0 352 0; dur: 12500; easing: linear; loop: true"
    animation__float="property: position; from: 0 0.18 0.25; to: 0 0.34 0.25; dur: 4600; easing: easeInOutSine; direction: alternate; loop: true">
    <a-gltf-model id="bagModelEntity" src="#bagModel" rotation="0 0 0"></a-gltf-model>
   </a-entity>
 </a-entity>
</a-scene>
<script>
const scene=document.getElementById('scene');
const status=document.getElementById('status');
const hint=document.getElementById('hint');
const target=document.getElementById('target');
const bagModel=document.getElementById('bagModelEntity');

// Wichtig: kein schwarzer WebGL-Hintergrund. Die Kamera soll der reale Raum sein.
scene.addEventListener('loaded',()=>{
  const r=scene.renderer;
  if(r){r.setClearColor(0x000000,0); r.setClearAlpha(0); r.autoClear=true;}
  const c=scene.canvas;
  if(c){c.style.background='transparent';}
});

// Plastische, transparente Materialeigenschaften auf jedes Mesh anwenden.
bagModel.addEventListener('model-loaded',()=>{
  const root=bagModel.getObject3D('mesh');
  if(!root)return;
  root.traverse(obj=>{
    if(!obj.isMesh || !obj.material)return;
    const materials=Array.isArray(obj.material)?obj.material:[obj.material];
    materials.forEach(m=>{
      m.transparent=true;
      m.opacity=0.48;
      m.depthWrite=false;
      m.side=THREE.DoubleSide;
      m.roughness=0.13;
      m.metalness=0.0;
      if('clearcoat' in m)m.clearcoat=0.72;
      if('clearcoatRoughness' in m)m.clearcoatRoughness=0.07;
      if('transmission' in m)m.transmission=0.18;
      if('thickness' in m)m.thickness=0.16;
      if('ior' in m)m.ior=1.45;
      m.needsUpdate=true;
    });
  });
});

target.addEventListener('targetFound',()=>{status.textContent='Müllplastik im Raum';hint.classList.add('hidden');setTimeout(()=>status.classList.add('hidden'),1200);});
target.addEventListener('targetLost',()=>{status.textContent='Foto wieder ins Bild nehmen';status.classList.remove('hidden');hint.classList.remove('hidden');});
setTimeout(()=>{if(!status.classList.contains('hidden'))status.textContent='Richte die Kamera auf das Foto';},3500);
</script>
</body>
</html>
