<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Was bleibt – AR V5</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
#status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99999;
background:rgba(0,0,0,.62);color:#fff;padding:9px 14px;border-radius:18px;
font:14px -apple-system,BlinkMacSystemFont,sans-serif;white-space:nowrap}
</style>
<script>
AFRAME.registerComponent('v5-bag',{
 init:function(){
   this.meshes=[];
   this.el.addEventListener('model-loaded',()=>{
     this.el.getObject3D('mesh').traverse(o=>{
       if(o.isMesh && o.morphTargetInfluences){
         o.material.transparent=true;
         o.material.opacity=.38;
         o.material.depthWrite=false;
         o.material.side=THREE.DoubleSide;
         o.material.roughness=.46;
         o.material.needsUpdate=true;
         this.meshes.push(o);
       }
     });
   });
 },
 tick:function(t){
   const s=t/1000;
   // Six overlapping slow organic cycles: never snaps between states.
   const vals=[
     .46*(.5+.5*Math.sin(s*.55)),
     .34*(.5+.5*Math.sin(s*.31+1.2)),
     .36*(.5+.5*Math.sin(s*.47+3.1)),
     .42*(.5+.5*Math.sin(s*.27+2.0)),
     .32*(.5+.5*Math.sin(s*.38+4.2)),
     .38*(.5+.5*Math.sin(s*.66+5.0))
   ];
   this.meshes.forEach(m=>{
     for(let i=0;i<Math.min(vals.length,m.morphTargetInfluences.length);i++)
       m.morphTargetInfluences[i]=vals[i];
   });
   // slow 360° turn plus slight floating/tumbling
   this.el.object3D.rotation.y=s*.145 + .11*Math.sin(s*.23);
   this.el.object3D.rotation.x=.055*Math.sin(s*.29+.7);
   this.el.object3D.rotation.z=.075*Math.sin(s*.37);
 }
});
</script></head>
<body>
<div id="status">Suche das Bild …</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes"
color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true"
vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-assets timeout="20000">
<a-asset-item id="bagAsset" src="./Muelltuete_AR_V5_morphing.glb"></a-asset-item>
</a-assets>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity light="type: ambient; intensity: 1.05"></a-entity>
<a-entity light="type: directional; intensity: 1.15" position="-1.5 2 3"></a-entity>
<a-entity light="type: directional; intensity: .55; color: #dce8ff" position="2 -1 1.5"></a-entity>
<a-entity id="target" mindar-image-target="targetIndex: 0">
  <a-entity position="0 0 .29"
    animation="property: position; from: 0 -.035 .29; to: 0 .045 .29; dur: 5600; easing: easeInOutSine; dir: alternate; loop: true">
    <a-gltf-model id="bag" src="#bagAsset" scale=".76 .76 .76" v5-bag></a-gltf-model>
  </a-entity>
</a-entity>
</a-scene>
<script>
const target=document.getElementById('target'),status=document.getElementById('status'),bag=document.getElementById('bag');
target.addEventListener('targetFound',()=>{status.textContent='✓ Bild erkannt';setTimeout(()=>status.style.display='none',900)});
target.addEventListener('targetLost',()=>{status.style.display='block';status.textContent='Bild verloren – wieder auf das Foto richten'});
bag.addEventListener('model-error',()=>{status.style.display='block';status.textContent='3-D-Modell konnte nicht geladen werden'});
</script>
</body></html>
